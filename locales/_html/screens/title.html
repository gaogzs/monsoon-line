<!-- ============ 屏幕：标题 ============ -->
<section id="scr-title" class="screen active">
  <!-- 左上角版本戳：内容由 js/version.js 提供，每次提交前重新生成。
       用途是确认当前部署的到底是哪一版 —— 浏览器缓存、Pages 重建延迟、
       推送失败这些都不好肉眼判断，但时间戳变了就说明新 commit 上线了。 -->
  <div id="verStamp" class="ver-stamp"></div>

  <div class="boot">
    <div class="bootline">{{html.title.bootline}}</div>
    <div class="bootline">{{html.title.bootline_2}}</div>
    <div class="bootline">{{html.title.bootline_3}}</div>
    <div class="bootline">{{html.title.bootline_4}}</div>
  </div>

  <h1 class="logo">MONSOON<span class="logo2">LINE</span></h1>
  <div class="logo-cn">{{html.title.logo-cn}}</div>
  <div class="logo-sub">{{html.title.logo-sub}}</div>

  <div class="title-lore">
    <p>{{html.title.p}}</p>
    <p>{{html.title.p_2}}</p>
    <p>{{html.title.p_3}}</p>
  </div>

  <div class="menu">
    <button class="btn primary" data-go="campaign">{{html.title.btn_campaign}}</button>
    <button class="btn" data-go="hangar">{{html.title.btn_hangar}}</button>
    <button class="btn" data-go="codex">{{html.title.btn_codex}}</button>
    <button class="btn" data-go="settings">{{html.title.btn_settings}}</button>
    <button class="btn" data-go="help">{{html.title.btn_help}}</button>
    <button class="btn" data-go="changelog">{{html.title.btn_changelog}}</button>
  </div>
  <div class="foot">{{html.title.foot}}</div>
</section>
