<!-- ============ 屏幕：设置 ============ -->
<section id="scr-settings" class="screen">
  <header class="bar">
    <span class="bar-t">{{html.settings.title}}</span>
    <span class="bar-r">{{html.settings.sub}}</span>
  </header>
  <div class="set-wrap" id="setWrap"></div>
  <footer class="bar bottom">
    <button class="btn" id="setReset">{{html.settings.setReset}}</button>
    <button class="btn primary" id="setClose">{{html.settings.setClose}}</button>
  </footer>
</section>
