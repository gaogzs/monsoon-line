<!-- ============ 屏幕：更新记录 ============ -->
<!-- 内容由 js/changelog.js 提供，而那是由 tools/build/release.js 从 CHANGELOG.md
     生成的 —— 这屏只是一副空壳，加新版本不需要动这个文件。
     版本号规则见 docs/VERSIONING.md。 -->
<section id="scr-changelog" class="screen">
  <header class="bar">
    <span class="bar-t">{{html.changelog.title}}</span>
    <span class="bar-r" id="clHead">—</span>
  </header>
  <div class="cl-wrap" id="clBody"></div>
  <footer class="bar bottom"><button class="btn" data-go="title">{{html.changelog.btn_title}}</button></footer>
</section>
