<!-- ============ 失败提示（停在游戏画面上，几秒后或点按钮进结算页） ============ -->
<div id="failing" class="overlay failing">
  <div class="fail-box">
    <div class="fail-t">{{html.failing.title}}</div>
    <div class="fail-reason" id="failReason"></div>
    <div class="fail-sub" id="failSub"></div>
    <button class="btn primary" id="btnFailEnd">{{html.failing.btnEnd}}</button>
  </div>
</div>
